// Random Recipes (随机合成表) — 1.8.9 Forge mod, built from scratch
// Skeleton copied from workspaces/ironfist-1.8.9
buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.8.9-1.0.0"
group = "com.dsh.randomrecipes"
archivesBaseName = "randomrecipes"

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '100000'
    options.compilerArgs << '-Xmaxwarns' << '100000'
}
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_20"
}

// JEI is a compile-time-only dependency: the compat classes are discovered by JEI at
// runtime and never loaded when JEI is absent, so the jar must not contain JEI itself.
dependencies {
    compile files('libs/jei_1.8.9-2.28.18.187.jar')
}

processResources
{
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
